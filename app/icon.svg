  <text x="32" y="33" font-family="Inter, system-ui, sans-serif" font-size="31" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="1" stroke="#0f172a" stroke-width="2.5" paint-order="stroke fill" filter="url(#sv-shadow)">SV</text>
